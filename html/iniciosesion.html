<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión</title>
     <link rel="stylesheet" href="/CSS/iniciosesion.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</head>
<body>
       <header>
      <section>
        <img
          class="logonaranja"
          src="/images/naranjanegro.jpg"
          alt="Logo"
          height="100px"
          width="100px"
        />
      </section>

</section>

 </header>

<section>


 <section class="presentaciones">

        <h2>Bienvenido nuevamente estimado cliente.</h2>

        <p class="descripcion">
            Inicia sesión para que puedas realizar tu pedido de pulpas de fruta.
        </p>


</section>

<section>
<form id="formularioLogin">

  <section class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Correo</label>
    <input type="email" class="form-control" id="exampleInputEmail1" required>
  </section>

  <section class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Contraseña</label>
    <input type="password" class="form-control" id="exampleInputPassword1" required>
  </section>

  <section class="mb-3 form-field">
    <input type="checkbox" id="exampleCheck1" class="check">
    <label for="exampleCheck1">Recordar</label>
  </section>

  <button type="submit" class="btn-solid theme-primary">Entrar</button>

</form>
</section>
</section>

<script>

document.getElementById("formularioLogin").addEventListener("submit", function(event) {

    event.preventDefault();

    alert("¡Sesión iniciada satisfactoriamente!");

    window.location.href = "/html/contacto.html";

});

</script>

</body>
</html>
