<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        <section class="contenido">
    

      <section class="contenido">
        <form
          class="formulario"
          action="https://docs.google.com/spreadsheets/d/1g_Ds0ZCL4q-Tkc9FWjVCZXZIoi9kS2K1RXgFlr83S_E/edit?usp=sharing"
          method="post"
        >
          <h2
            style="
              font-family:
                &quot;Trebuchet MS&quot;, &quot;Lucida Sans Unicode&quot;,
                &quot;Lucida Grande&quot;, &quot;Lucida Sans&quot;, Arial,
                sans-serif;
            "
          >
            ¿Precio mayorista para tu negocio?
          </h2>
          <p
            style="
              font-family:
                &quot;Trebuchet MS&quot;, &quot;Lucida Sans Unicode&quot;,
                &quot;Lucida Grande&quot;, &quot;Lucida Sans&quot;, Arial,
                sans-serif;
            "
          >
            Puedes cotizar tu pedido aquí
          </p>
          <section class="campo nombre">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required />
          </section>

          <section class="datos">
            <section class="campo">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required />
            </section>

            <section class="campo">
              <label for="numero">Número</label>
              <input type="tel" id="numero" name="numero" required />
            </section>
          </section>

          <section>
            <label for="pedido">Pedido</label>
            <textarea id="pedido" name="pedido" required></textarea>
          </section>

          <button type="submit" class="enviar">ENVIAR</button>
        </form>
      </section>
    </section>
  </body>
</body>
</html>
